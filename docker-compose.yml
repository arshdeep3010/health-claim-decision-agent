# Local development stack. Real secrets come from your shell / .env, never committed.
# One-command run:  docker compose up --build
# SYNTHETIC DATA ONLY.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hcda-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-healthclaim}
      POSTGRES_USER: ${DATABASE_USERNAME:-healthclaim}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-healthclaim}
    ports:
      # Host port is configurable to avoid clashing with a local PostgreSQL.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - hcda_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-healthclaim} -d ${DATABASE_NAME:-healthclaim}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: hcda-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Backend talks to the db service over the compose network (no host-port clash).
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-healthclaim}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-healthclaim}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-healthclaim}
      # Embeddings: zero-key local provider by default (dev/demo).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      # Mercury: noop by default so the stack runs with no API keys. Set these to
      # MERCURY_PROVIDER=openrouter + base-url/key/model to enable real AI.
      MERCURY_PROVIDER: ${MERCURY_PROVIDER:-noop}
      MERCURY_BASE_URL: ${MERCURY_BASE_URL:-}
      MERCURY_API_KEY: ${MERCURY_API_KEY:-}
      MERCURY_MODEL: ${MERCURY_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-0123456789-abcdefghijklmnop}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  hcda_pgdata:
