name: Deploy to AWS

# Runs after CI passes on main (or by hand). Authenticates to AWS with GitHub's OIDC
# token: no AWS keys are stored in GitHub. The role it assumes (infra/aws/template.yaml)
# can only push this repo's image, update this Lambda, write the site bucket and
# invalidate this CloudFront distribution. Application secrets live only in the
# Lambda's configuration; this workflow never sees them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push and deploy
    # Skips until the AWS settings exist (repository variables set after the stack is created).
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      LAMBDA_FUNCTION: ${{ vars.LAMBDA_FUNCTION }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lambda
          platforms: linux/amd64
          provenance: false          # Lambda rejects multi-manifest (attestation) images
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$SHA" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated-v2 --function-name "$LAMBDA_FUNCTION"

      - name: Smoke test the API (allows for a cold start)
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$SITE_URL/actuator/health/readiness" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not become healthy"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish the UI to S3 and refresh CloudFront
        working-directory: frontend
        run: |
          # Hashed assets can be cached for a year; index.html must always be fresh.
          aws s3 sync dist "s3://$SITE_BUCKET" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/" --query 'Invalidation.Id' --output text

      - name: Summary
        run: echo "Deployed $SHA to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
