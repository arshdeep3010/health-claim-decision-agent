name: Docker image

# Builds the container image on pushes to main and version tags, and publishes it
# to GitHub Container Registry (GHCR) using the built-in GITHUB_TOKEN — no cloud
# credentials required to prove the pipeline. Deploying to a paid environment
# (AWS ECR + Lambda) is documented in docs/aws-ecr-deploy.md and is intentionally
# NOT automated here.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  image:
    name: Build & publish image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # To deploy to AWS instead, configure repository secrets and use the ECR
      # login + push steps from docs/aws-ecr-deploy.md (not run automatically so
      # nothing deploys to a paid environment without explicit setup).
